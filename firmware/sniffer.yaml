# SmarterFan — milestone 0: RF protocol sniffer
#
# Read-only. Taps the fan's 433 MHz receiver output and dumps every packet it
# sees. Requires NO modification to the fan board. See README.md.
# firmware/relay.yaml is the build that also transmits and drives the LEDs.

esphome:
  name: smarterfan-sniffer
  friendly_name: SmarterFan Sniffer

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # The ADC dump is ~500 lines back to back; the default 512-byte buffer drops
  # most of them (log8.txt lost 2112 of 3584 samples).
  tx_buffer_size: 8192
  task_log_buffer_size: 4096
  # C3 has native USB-Serial-JTAG; this puts logs on the USB-C port.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5db
  ap:
    ssid: "SmarterFan Setup"
    password: !secret ap_password

captive_portal:

# Wi-Fi over USB without recompiling.
improv_serial:

# Required for `esphome logs` over Wi-Fi, which is how captures are read while
# the board runs off a floating USB power bank.
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# For antenna work. RSSI bounces several dB on its own, so compare the median
# between configurations, not the raw value.
# sensor:
#   - platform: wifi_signal
#     name: "WiFi signal"
#     id: wifi_rssi
#     update_interval: 1s

#   - platform: wifi_signal
#     name: "WiFi signal median"
#     update_interval: 1s
#     filters:
#       - median:
#           window_size: 10
#           send_every: 10

remote_receiver:
  pin:
    # Fed by a 10k/22k divider off the receiver output pad: 3.08V, clearing the
    # C3's 2.475V Vih. Do NOT use 10k/10k -- 2.24V is inside the undefined band.
    #
    # A divider, not the BSS138 module: it has no path from any supply into the
    # pad, so it cannot lift the receiver's low level the way the shifter's
    # pull-ups do (~620uA in, holding the pad at 0.8V instead of 0V).
    number: GPIO6

  # NO dumper, deliberately. `dump: raw` prints every capture, noise included
  # -- ~2500 a session at `idle: 4ms` -- and buries the frames it should show;
  # `fan_rf`'s own dump_frames is the readable stage above it. The IR decoders
  # can never match a 433 MHz OOK capture, and `rc_switch`'s dumper only knows
  # its 8 built-in profiles, so its silence says nothing about this protocol.
  #
  # RE-ENABLE for a capture session: tools/decode_fan_rf.py and
  # tools/fan_rf_selftest.cpp both parse `Received Raw:` lines. Uncomment, run
  # `esphome logs > logN.txt`, then comment it out again.
  #
  # dump:
  #   - raw

  # Must stay below 136us, the shortest real symbol under worst-case AGC skew:
  # at 200us the compressed early spaces merge away and frame 1 is destroyed.
  # It is also not the tool for noise -- noise overlaps the real symbols
  # completely -- and going lower breaks press correlation, since idle noise
  # then generates captures of its own. See README.
  filter: 100us

  # `filter_symbols: 120` would drop the garbage bursts (max 95 symbols) while
  # passing real packets (166). Left off: a session is only ~15 captures and
  # the garbage is worth seeing while the receive path is being characterised.

  # One rmt_receive() holds this many symbols and completes on `idle` OR when
  # it fills; anything arriving during the re-arm is lost. The 192 default was
  # silently eating cold presses, which run to ~190 symbols against a clean
  # packet's 166. 1024 is ~758 ms of continuous capture.
  receive_symbols: 1024

  # Must hold at least 2*(event + receive_size); receive_size is 4 KB here, so
  # the 10000 default would leave room for barely two queued captures.
  buffer_size: 32768

  # Gap that ends a capture, deliberately below the 8.79ms inter-frame gap so
  # each of the five repeats is its own capture. It sits 4.6x above the longest
  # in-frame space (865us) and 1.9x below the 7.69ms preamble gap, so it can
  # neither split a frame nor merge two. The old 12ms never terminated during a
  # hold -- frames arrive every 41.1ms -- and truncated after ~1.3 s.
  #
  # Verified offline across 14 logs, 74/74 presses, at every idle from 12ms
  # down to 1.5ms. Raise it back to 12ms to get a whole burst on one
  # `dump_frames` line.
  idle: 4ms

  # Timing slack for other listeners on this receiver; `fan_rf` carries its own
  # window in fan_rf_protocol.h. 25% was too tight and fired on 5 of 37
  # presses: the AGC skews duty cycle, so the 242us short space arrives as
  # little as 136us. 40% covers all 9664 measured symbols with no overlap
  # between the two symbol classes, which sit a clean 3:1 apart.
  tolerance: 40%

# --- decode ----------------------------------------------------------------
# PROTOCOL.md is the reference for the wire format and the key table.
#
# The three `rc_switch_raw` sensors that used to live here could not have
# worked: RCSwitchBase::decode() reads from offset 0 and never rescans, and the
# AGC corrupts the first of the five frames while it settles -- frame 1 decodes
# 40% of the time, frames 3-5 100%. `fan_rf` splits the capture on the
# inter-frame gap and decodes each frame independently instead.
external_components:
  - source:
      type: local
      path: components
    components: [fan_rf]

fan_rf:
  id: fan_remote

  # A hold just resends the same frame every 41.1ms, counter unchanged, so
  # frames are counted to tell a tap from a hold:
  #
  #   frame:  1   2   3   4   5   6   7   8  ...
  #   event:  P   .   .   .   .   R1  R2  R3
  #
  # Set to 1 to report every frame the remote sends.
  press_frames: 5

  # A run of identical frames ends after this long without one. Six frame
  # periods: rides out dropped frames, still notices a release promptly, and
  # separates the ninth press of a button -- the counter wraps at 8 -- from the
  # same hold continuing.
  run_timeout: 250ms

  # Stage 1: one line per capture, every 32-bit word that decoded, before any
  # field is inspected. Turn on when a press is not being recognised and you
  # need to know whether the frames arrived at all.
  #
  #   [D][fan_rf]: 65 symbols, 2 chunks, 1 frame: 10100001110110000010000111101001
  dump_frames: false

  # Stage 3: the decoded presses and held repeats.
  #
  #   [D][fan_rf]: press  key= 3 (bright+) counter=6  0xA1D82169
  #   [D][fan_rf]: repeat key= 3 (bright+) counter=6  0xA1D82169  #1
  dump_commands: true

  # The useful primitive: key, press counter, raw code, and a repeat index that
  # is 0 for the press and 1, 2, 3... for each frame of a hold.
  on_code:
    - lambda: |-
        ESP_LOGI("remote", "key=%u counter=%u code=0x%08lX repeat=%lu",
                 key, counter, (unsigned long) code, (unsigned long) repeat);

# Named buttons on the same decode. `key` takes any name from PROTOCOL.md
# section 4, or a raw 0-31 value. `repeats` defaults to true, so a hold pulses
# the sensor every 41.1ms; turn it off where a long press should fire once.
# binary_sensor:
#   - platform: fan_rf
#     name: "Remote: brightness up"
#     key: bright_up

#   - platform: fan_rf
#     name: "Remote: brightness down"
#     key: bright_down

#   - platform: fan_rf
#     name: "Remote: light on/off"
#     key: light_toggle
#     repeats: false

# Transmit lives in relay.yaml, which needs the board modified.

# DIAGNOSTIC — raw analogue streamer on GPIO3 (ADC1 channel 3), disabled:
# GPIO3 cannot serve the ADC and the RMT at once, and that node is already
# known to carry clean packets (log13/log14). Streams continuously with no
# trigger, on purpose -- every triggered version ended up choosing which
# windows we were allowed to look at.
#
#   pad --[10k]-- GPIO3 --[10k]-- GND     straight off the pad, NOT the BSS138
#
# Halves 4.48V to 2.24V, inside the C3's ~3.1V range at 12dB attenuation; 20k
# is a 0.22mA load and a 5k source impedance. Move the RMT pin off GPIO6 to
# re-enable.
# external_components:
#   - source:
#       type: local
#       path: components
#     components: [adc_logger]
#
# adc_logger:
#   id: adc_log
#   channel: 3
#   sample_rate: 10000
#   queue_lines: 32
