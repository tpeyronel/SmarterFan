# SmarterFan — milestone 2: RF relay + LED dimming
#
# Decodes the remote off the OEM receiver's output pad (GPIO6) and injects
# reconstructed commands into the OEM MCU's RF input (GPIO5). The light keys
# stop here instead: the ESP32 drives the two dimming optocouplers itself
# (GPIO7, GPIO10) as one CWWW entity.
#
# REQUIRES BOTH BOARD MODIFICATIONS -- the `102` between receiver and MCU out
# with a level shifter on both lines, and `R37`/`R38` out with a 620 Ohm from
# GPIO7 and GPIO10 to the pads they leave floating. See README.md.
# firmware/sniffer.yaml is the read-only build and needs neither.

# --- bring-up knobs --------------------------------------------------------
# Settled against hardware except where noted. Open questions are in README.md.
substitutions:
  # Non-inverting: more opto current = brighter. Measured. Both channels alike.
  led_inverted: "false"

  # Duty floor per channel, on but at its dimmest. MEASURED, and this is the
  # floor rather than a preference: at 250 Hz 0.1% is a 3.9 us pulse and both
  # channels still light, 0.07% is 2.7 us and both go dark. That is the PC817's
  # switching time, not a duty limit, so it moves with pwm_frequency -- halve
  # the carrier and the same pulse is half the duty. See README > Dimming.
  min_power_r37: "0.1%"
  min_power_r38: "0.1%"

  # Lower carrier = dimmer minimum (the MT9722S gates, it does not average).
  # 250 Hz sits exactly on the measured flicker floor. See README > Dimming.
  pwm_frequency: "0.25kHz"

  # One step of a brightness button, as a fraction of full brightness. A hold
  # pulses every 41.1 ms, so 0.02 sweeps the range in ~2.1 s, and a tap is one
  # step of the same size. A fraction rather than a percentage because it is
  # also passed to the brightness_step script, whose parameter is a float.
  dim_step: "0.02"

  # Floor a hold stops at, and where the sunrise fade begins: dim_relative
  # switches the light off at zero, and `light on/off` / `all off` are the
  # buttons for that. A fraction rather than "1%" because the sunrise lambdas
  # need it as a C++ literal; ESPHome's percentage validator takes either form.
  dim_floor: "0.01"

  # One colour temperature step, as a fraction of the mireds range, so the
  # sweep stays ~2 s whatever the Kelvin endpoints below become.
  ct_step: "0.02"

  # IANA name, set explicitly rather than left to ESPHome's autodetect -- which
  # reads the clock of whatever machine ran the compile. The sunrise alarm is a
  # wall-clock comparison, so a wrong zone is a fade an hour out, not an error.
  # Home Assistant's own timezone has to agree with this one.
  timezone: "America/Argentina/Buenos_Aires"

  # One step of the sunrise fade, and the transition length of that step, so
  # the light interpolates across the gap instead of stepping over it. Shorter
  # is not smoother -- the transition already covers it -- only more state
  # updates: 5 s is ~360 across a half-hour fade where 1 s would be 1800.
  sunrise_tick: "5s"

  # `Sunrise: test` runs the entire curve in this many seconds.
  sunrise_test_seconds: "60"

esphome:
  name: smarterfan-relay
  friendly_name: SmarterFan Relay

  # `Sunrise progress` is publish-only -- the fade pushes it and nothing polls
  # it -- so without this it reads "unknown" until the first sunrise ever runs.
  on_boot:
    priority: -100
    then:
      - sensor.template.publish:
          id: sunrise_progress
          state: 0.0

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # C3 has native USB-Serial-JTAG; this puts logs on the USB-C port.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5db
  power_save_mode: none

  # Static, because Home Assistant runs off-site and reaches the device over a
  # VPN. mDNS does not cross the tunnel, so `smarterfan-relay.local` does not
  # resolve from there and the API connection has to name a bare IP -- which a
  # DHCP lease change would silently break.
  manual_ip:
    static_ip: 192.168.100.120
    gateway: 192.168.100.1
    subnet: 255.255.255.0
    dns1: 192.168.100.1

  # Reboots 15min after the network goes away. The remote needs no network, so
  # a router outage would blink the light every 15 minutes for nothing. Cost of
  # 0s: a wedged radio needs a power cycle at the wall.
  reboot_timeout: 0s
  ap:
    ssid: "SmarterFan Setup"
    password: !secret ap_password

captive_portal:

improv_serial:

api:
  encryption:
    key: !secret api_key

  # The same default, and the one that bites: with no API client connected the
  # device reboots itself every 15 minutes, forever, blanking both optocouplers
  # each time. The web_server page does NOT count; only the native API resets
  # the timer. See README > Two defaults that reboot the fan.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# http://smarterfan-relay.local/ -- a control for every entity, served by the
# device. Unauthenticated; add `auth:` if that is not wanted.
web_server:
  port: 80

external_components:
  - source:
      type: local
      path: components
    components: [fan_rf]

# --- receive: the OEM receiver's output pad --------------------------------
# Identical to sniffer.yaml; every value settled against real captures. See
# README > Two settings that matter before changing any of it.
remote_receiver:
  pin:
    number: GPIO6
  # Below the 136us shortest real symbol, above the idle noise.
  filter: 100us
  # Below the 8.79ms inter-frame gap, so each repeat is its own capture.
  idle: 4ms
  receive_symbols: 1024
  buffer_size: 32768
  tolerance: 40%

# --- transmit: into the OEM MCU's RF input ---------------------------------
remote_transmitter:
  id: fan_tx
  pin: GPIO5

  # OOK at baseband -- the MCU wants the demodulated signal, not a carrier, so
  # 100% duty is the carrier switched off.
  carrier_duty_percent: 100%

  # RMT symbols for this channel (the C3 default, stated because the payload
  # depends on it). Largest payload is preamble + one frame = 34 words, so the
  # burst stages in one pass and never depends on a refill interrupt. Raising
  # `tap_frames` overflows that: go to 96 here and drop the receiver's
  # rmt_symbols to 48 to stay inside the C3's 192 words.
  rmt_symbols: 48

  # Hand the line back after each frame rather than blocking loop() for 41.4 ms
  # -- the next received repeat is decoded while the current frame goes out.
  non_blocking: true

fan_rf:
  id: fan_remote
  transmitter_id: fan_tx

  press_frames: 5
  run_timeout: 250ms
  dump_frames: false
  # Injected frames as well as decoded ones:
  #
  #   [D][fan_rf]: press  key=18 (fan 2) counter=3  0xA1D8290D
  #   [D][fan_rf]: inject key=18 (fan 2) counter=1  0xA1D82919  1x +preamble
  dump_commands: true

  # Forward fan keys only; light keys and the three claimed buttons stop here.
  # `all off` is forwarded too (it must reach the MCU) and handled locally in
  # parallel. See README for the key table.
  relay: fan

  # Tap/hold deadline, and pure added latency on every tap. Cannot go below
  # press_frames x 41.1 ms = 205 ms, where the first repeat of a hold lands.
  relay_decision: 230ms

  # Frames per tap. One is enough on hardware -- the remote's five are for a
  # noisy RF link and this is a wire. Raise rmt_symbols above if you raise it.
  tap_frames: 1

  # The fan half of the remote, mirrored into the Home Assistant entity below.
  # This is the only feedback path the fan has: the MCU reports nothing, so
  # without it a press of the handheld remote would leave the entity stale.
  #
  # Nothing here transmits. The relay has already forwarded this very press --
  # `fan_show_*` only moves the entity, and moves the shadow with it so that
  # on_state does not send it straight back.
  on_code:
    - lambda: |-
        using namespace smarterfan::fan_rf;
        // The press itself. A held fan key repeats one command, and acting on
        // the repeats would re-run the same call every 41.1 ms for nothing.
        if (repeat != 0)
          return;
        const int speed = speed_for_key(key);
        if (speed >= 0) {
          id(fan_show_speed).execute(speed);
        } else if (key == KEY_FAN_FORWARD || key == KEY_FAN_REVERSE) {
          id(fan_show_direction).execute(key == KEY_FAN_REVERSE);
        }

# A restart takes the GPIOs high-Z and drops both optocouplers for the few
# hundred ms the light needs to come back, which reads as a flicker. Uptime and
# reset_reason are how that is told apart from the analogue path after the fact.
debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 30s

  # Antenna and placement check -- a canopy is a poor RF environment. README
  # wants better than -70 dBm from the mounted position.
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

  # Publish-only: the fade pushes a value every step and zero when it stops, so
  # an idle device is not sending a percentage every few seconds. This is the
  # only visibility into a process that runs for half an hour before dawn and
  # touches exactly one entity.
  - platform: template
    id: sunrise_progress
    name: "Sunrise progress"
    icon: mdi:weather-sunset-up
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

# --- fan: the six OEM speeds -----------------------------------------------
# Optimistic, because there is nothing to be optimistic against: the MCU never
# reports its state and the injection path is one-way into it. What this entity
# holds is the last command anyone is known to have sent -- from Home
# Assistant, from a button below, or from the handheld remote by way of
# `on_code` above -- and never a reading of what the motor is doing.
#
# The two globals are the other half of that: what was last put on the wire.
# Every path that commands the fan writes them, and `on_state` transmits only
# where the entity and the shadow disagree. That is what keeps a mirrored
# remote press from being echoed back at the MCU it just came from.
globals:
  - id: fan_sent_speed
    type: int
    restore_value: false
    # -1 is "nothing sent since boot", so the first thing Home Assistant asks
    # for goes out even when the entity already claims that state. After an
    # ESP32-only restart the fan keeps running and this entity does not know
    # it; that first command is what puts the two back together.
    initial_value: '-1'

  - id: fan_sent_reverse
    # Not a bool: -1 unknown, 0 forward, 1 reverse. Starts at 0 rather than -1
    # because a fan that restores nothing starts the entity at FORWARD, and the
    # shadow has to agree with it -- otherwise the first command of the session
    # would carry a direction change nobody asked for.
    type: int
    restore_value: false
    initial_value: '0'

  # --- sunrise alarm ---
  # The fade's clock is millis(), not the wall clock. The wall clock decides
  # when to start and is not consulted again, so an SNTP correction landing
  # mid-fade cannot jump the light.
  - id: sunrise_active
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: sunrise_t0_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: sunrise_span_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # The alarm this session has already acted on, as an epoch. Written when a
  # sunrise arms and left written when one is cancelled, which is what makes a
  # cancel final for that alarm instead of something the next tick undoes.
  #
  # Not restored, deliberately: after a reboot mid-fade the window test matches
  # again and the sunrise resumes where it left off, rather than the light
  # staying dark for the rest of the morning.
  - id: sunrise_handled
    type: int64_t
    restore_value: false
    initial_value: '0'

  # What the last step commanded -- the same shadow trick the fan entity uses
  # above. The light's on_state fires for every change including the fade's
  # own, and what separates a person from the fade is whether the value that
  # got published is the one the step had just written here.
  - id: sunrise_shadow_brightness
    type: float
    restore_value: false
    initial_value: '0.0f'

  - id: sunrise_shadow_mireds
    type: float
    restore_value: false
    initial_value: '0.0f'

fan:
  - platform: template
    id: fan_motor
    name: "Fan"

    # The OEM's six, no more. Fan speed belongs to the MCU and this build
    # routes commands through it rather than replacing it -- see
    # README > Out of scope.
    speed_count: 6

    # `fan forward` and `fan reverse` are two separate keys, so direction is a
    # value to set rather than a toggle to pulse.
    has_direction: true

    # Nothing restored, so a restart publishes nothing and therefore injects
    # nothing -- neither a command to the MCU nor a claim about a fan this
    # build cannot read. The price is that the entity reads off/forward until
    # the next command or the next press of the remote, and that turning it on
    # without naming a speed starts at 6, which is ESPHome's own reading of
    # "on" at speed 0.
    restore_mode: NO_RESTORE

    on_state:
      - lambda: |-
          using namespace smarterfan::fan_rf;
          // Everything that moves the entity lands here -- Home Assistant, the
          // buttons, the mirrored remote presses -- and only what the shadow
          // says is unsent has anything left to transmit.
          const int speed = id(fan_motor).state ? id(fan_motor).speed : 0;
          if (speed != id(fan_sent_speed)) {
            id(fan_sent_speed) = speed;
            id(fan_remote).send_key(key_for_speed((uint8_t) speed));
          }
          // One call can change both, and then two keys go out back to back.
          // The second blocks until the first is off the wire -- one frame and
          // its gap, 41 ms -- because there is no way to say "speed 3 in
          // reverse" in one frame. Six speeds and two directions are eight
          // separate buttons on the remote.
          const int reverse = id(fan_motor).direction == fan::FanDirection::REVERSE;
          if (reverse != id(fan_sent_reverse)) {
            id(fan_sent_reverse) = reverse;
            id(fan_remote).send_key(reverse ? KEY_FAN_REVERSE : KEY_FAN_FORWARD);
          }

# --- LED dimming: the two optocouplers -------------------------------------
# Each GPIO drives a PC817 through 620 Ohm into the pad `R37`/`R38` left
# floating by the modification. Named after the pad, not the colour.
#
# Frequency and min_power are one setting in two halves -- what the opto sees
# is a pulse width, min_power / frequency -- so neither moves alone.
output:
  - platform: ledc
    id: led_r37
    pin: GPIO7
    frequency: ${pwm_frequency}
    min_power: ${min_power_r37}
    # Mandatory next to min_power: the mix commands one channel to exactly zero
    # at either end of the CT range, and without this it would still emit
    # min_power -- a faint glow that never goes away.
    zero_means_zero: true
    inverted: ${led_inverted}

  - platform: ledc
    id: led_r38
    pin: GPIO10
    frequency: ${pwm_frequency}
    min_power: ${min_power_r38}
    zero_means_zero: true
    inverted: ${led_inverted}

light:
  - platform: cwww
    id: led_light
    name: "Light"

    # Measured by observation: R38/GPIO10 is cold, R37/GPIO7 is warm.
    cold_white: led_r38
    warm_white: led_r37

    # Guesses -- neither channel has been measured. These only label the HA
    # slider; the mix normalises whatever range they describe.
    cold_white_color_temperature: 6500K
    warm_white_color_temperature: 2700K

    # The default, stated because it is load-bearing: without it 100% cannot
    # drive both LEDs to full. The price is that total output roughly doubles
    # toward the middle of the CT sweep, which is visible.
    constant_brightness: false

    # A hold delivers 24 steps a second; the 1s default would overlap them all.
    # Automations that want a fade pass their own transition_length.
    default_transition_length: 0s

    # Brightness, mix and on/off survive a restart -- including turning the
    # light back on when a blackout ends.
    restore_mode: RESTORE_DEFAULT_OFF

    # Touching the light during a sunrise ends the sunrise. There is no list of
    # sources to keep current, because every one of them -- the remote's light
    # keys, the buttons below, a Home Assistant slider, the web page -- arrives
    # here as a published state. What separates them from the fade's own steps
    # is the shadow, written immediately before each step's light.control.
    #
    # on_state fires once per light call, with remote_values already holding
    # the target of the transition rather than an interpolated value, so the
    # comparison is exact and a running fade does not trip it. The tolerances
    # are wide enough for any rounding on the way through LightCall and far
    # narrower than one press of a brightness or temperature key.
    on_state:
      - lambda: |-
          if (!id(sunrise_active))
            return;
          const auto &v = id(led_light).remote_values;
          if (!v.is_on() ||
              fabsf(v.get_brightness() - id(sunrise_shadow_brightness)) > 0.002f ||
              fabsf(v.get_color_temperature() - id(sunrise_shadow_mireds)) > 1.0f) {
            id(sunrise_cancel).execute();
          }

# --- sunrise alarm ---------------------------------------------------------
# The fade runs here rather than in Home Assistant, and HA's only job is to
# keep `Alarm time` pointing at the phone's next alarm. Everything after that
# -- when to start, the curve, where it ends -- is on the ESP32, so a Wi-Fi or
# Home Assistant outage between setting the alarm at night and waking up in the
# morning costs nothing. Same reasoning as the RF relay: the job that matters
# must not go through the network stack.
#
# docs/homeassistant.md has the one HA automation that mirrors an Android alarm
# into `Alarm time`, and what it needs from the companion app.

time:
  # The whole feature is a wall-clock comparison, so the clock has to be right
  # and it has to survive Home Assistant being unreachable. Both platforms set
  # the system clock and `id(rtc).now()` reads that, so either alone is enough:
  # SNTP if the LAN has a route to the internet, Home Assistant if only the VPN
  # is up. Neither is a given here, which is why both are configured.
  - platform: sntp
    id: rtc
    timezone: ${timezone}

  - platform: homeassistant
    id: rtc_ha
    timezone: ${timezone}

datetime:
  # The wake time, as a Home Assistant `datetime` entity. A standard entity
  # rather than a custom API action, so HA writes it with `datetime.set_value`
  # and nothing bespoke has to exist on the HA side -- and so it is settable by
  # hand from the device's own web page when there is no HA at all.
  #
  # Wall clock, not an epoch: what is stored is Y/M/D h:m:s in ${timezone},
  # which is what HA sends and what `state_as_esptime()` turns back into an
  # epoch for the comparison. HA's timezone and ${timezone} have to agree.
  - platform: template
    id: alarm_time
    name: "Alarm time"
    type: datetime
    optimistic: true
    # Survives a reboot, which is the point of putting it here: an OTA or a
    # watchdog at 03:00 must not lose the alarm. A restored time already in the
    # past simply never fires -- what arms the fade is a window, not a
    # "later than".
    restore_value: true

switch:
  # The master enable. Off and the arming check returns immediately, so a
  # restored alarm time sits there inert rather than needing to be cleared.
  - platform: template
    id: sunrise_enabled
    name: "Sunrise alarm"
    icon: mdi:weather-sunset-up
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

number:
  # How far before the alarm the light starts.
  - platform: template
    id: sunrise_duration
    name: "Sunrise duration"
    icon: mdi:timer-sand
    unit_of_measurement: min
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 30
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  # Where the fade ends. 100% at the default colour temperature below is the
  # full 56 W.
  - platform: template
    id: sunrise_end_brightness
    name: "Sunrise end brightness"
    icon: mdi:brightness-7
    unit_of_measurement: "%"
    # Not 0: a sunrise that ends dark is a disabled sunrise, and there is a
    # switch for that. The bottom of the range is roughly `night mode`.
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    mode: slider
    entity_category: config

  # Where the colour ends. The fade always starts at the warmest the light can
  # do and runs to here.
  #
  # 3800 K is the default because it is the middle of the mireds range, and the
  # middle is where BOTH channels reach full: the cwww mix normalises by the
  # larger fraction, so total output peaks there and falls away toward either
  # end. 6500 K is the cold channel alone -- bluer, and about half the light.
  # See README > How it works.
  - platform: template
    id: sunrise_end_kelvin
    name: "Sunrise end colour temperature"
    icon: mdi:temperature-kelvin
    unit_of_measurement: K
    # The endpoints the light itself declares. Anything outside is clamped to
    # the mireds range when the step runs, so these only shape the slider.
    min_value: 2700
    max_value: 6500
    step: 100
    initial_value: 3800
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

# One timer for both halves of the feature: while a sunrise runs this is the
# fade's clock, and the rest of the time it is the arming check. Arming is a
# handful of comparisons, so polling it costs nothing and there is no timer to
# schedule, cancel or lose when the alarm time changes.
interval:
  - interval: ${sunrise_tick}
    then:
      - if:
          condition:
            lambda: 'return id(sunrise_active);'
          then:
            - script.execute: sunrise_step
          else:
            - script.execute: sunrise_arm

# ESPHome has light.dim_relative but no colour temperature equivalent.
script:
  - id: colour_temp_step
    parameters:
      # Signed fraction of the mireds range; positive is warmer.
      delta: float
    then:
      # control, not turn_on: temp+ on a light that is off adjusts the mix it
      # will come back at rather than switching it on.
      - light.control:
          id: led_light
          color_temperature: !lambda |-
            auto traits = id(led_light).get_traits();
            const float lo = traits.get_min_mireds();
            const float hi = traits.get_max_mireds();
            float cur = id(led_light).remote_values.get_color_temperature();
            // Zero on a first boot with nothing restored: start from the middle.
            if (cur < lo || cur > hi)
              cur = (lo + hi) / 2.0f;
            return clamp(cur + delta * (hi - lo), lo, hi);

  # One step of brightness, in either direction. A script rather than four
  # copies of the action: the remote's two keys and the two buttons below all
  # want the same step and the same floor.
  - id: brightness_step
    parameters:
      # Signed fraction of full brightness; positive is brighter.
      delta: float
    then:
      - light.dim_relative:
          id: led_light
          relative_brightness: !lambda 'return delta;'
          brightness_limits:
            min_brightness: ${dim_floor}
            max_brightness: 100%

  # The two presets, each behind one script for the same reason: the remote key
  # and the Home Assistant button are the same command from two places.
  - id: light_full_bright
    then:
      - light.turn_on:
          id: led_light
          brightness: 100%
          # Middle of the range: both fractions normalise to 1.0, both LEDs full.
          color_temperature: !lambda |-
            auto traits = id(led_light).get_traits();
            return (traits.get_min_mireds() + traits.get_max_mireds()) / 2.0f;

  - id: light_night_mode
    then:
      - light.turn_on:
          id: led_light
          brightness: ${dim_floor}
          color_temperature: !lambda |-
            return id(led_light).get_traits().get_max_mireds();

  # The fan entity, moved without transmitting anything: what the fan is now
  # believed to be doing. This is how a press of the handheld remote -- already
  # forwarded by the relay -- and the raw buttons below keep the entity honest.
  #
  # Writing the shadow before the state change is the whole trick: on_state
  # then finds nothing left to send and the command does not go out twice.
  - id: fan_show_speed
    parameters:
      # 1..6, or 0 for off.
      speed: int
    then:
      - lambda: |-
          id(fan_sent_speed) = speed;
          if (speed == 0) {
            id(fan_motor).turn_off().perform();
          } else {
            id(fan_motor).turn_on().set_speed(speed).perform();
          }

  - id: fan_show_direction
    parameters:
      reverse: bool
    then:
      - lambda: |-
          id(fan_sent_reverse) = reverse ? 1 : 0;
          auto call = id(fan_motor).make_call();
          call.set_direction(reverse ? fan::FanDirection::REVERSE : fan::FanDirection::FORWARD);
          call.perform();

  # --- sunrise alarm ---
  # Is now inside a sunrise window, and if so, claim it. Runs on every tick
  # that a fade is not already running.
  - id: sunrise_arm
    mode: single
    then:
      - lambda: |-
          if (!id(sunrise_enabled).state)
            return;
          // Never set, or the entity is not restored yet: nothing to wake for.
          if (!id(alarm_time).has_state() || !id(sunrise_duration).has_state())
            return;
          const auto now = id(rtc).now();
          // No clock yet. SNTP and Home Assistant both take a few seconds
          // after boot, and comparing against an unset clock would fire the
          // fade at a time that means nothing.
          if (!now.is_valid())
            return;

          const int64_t alarm = (int64_t) id(alarm_time).state_as_esptime().timestamp;
          // One sunrise per alarm. Set below when a fade arms, so a cancel --
          // or a skip -- is final until Home Assistant pushes the next alarm.
          if (alarm == id(sunrise_handled))
            return;

          const int64_t span = (int64_t) (id(sunrise_duration).state * 60.0f);
          const int64_t start = alarm - span;
          const int64_t t = (int64_t) now.timestamp;
          // A window, not a deadline. An alarm restored from before a reboot,
          // or one Home Assistant pushes for tomorrow, is simply not in it,
          // and neither is the rest of the morning after the alarm passes.
          if (t < start || t >= alarm)
            return;

          id(sunrise_handled) = alarm;

          // An alarm has no business dimming a room somebody is sitting in.
          // At or below the floor counts as off: that is where the fade would
          // start anyway, and where `night mode` leaves the light.
          if (id(led_light).remote_values.is_on() &&
              id(led_light).remote_values.get_brightness() > ${dim_floor} + 0.001f) {
            ESP_LOGI("sunrise", "in window, but the light is already on -- skipping");
            return;
          }

          // Start from where the clock says rather than from zero. This is
          // also the path a reboot mid-fade comes back in through, and it has
          // to resume the sunrise, not restart it.
          id(sunrise_span_ms) = (uint32_t) (span * 1000);
          id(sunrise_t0_ms) = millis() - (uint32_t) ((t - start) * 1000);
          id(sunrise_active) = true;
          ESP_LOGI("sunrise", "starting, %d s of fade to the alarm", (int) (alarm - t));
      - if:
          condition:
            lambda: 'return id(sunrise_active);'
          then:
            # Straight into the first step rather than waiting a tick, so a
            # resumed fade jumps to its true position immediately.
            - script.execute: sunrise_step

  # One step of the fade, and the whole of it: nothing is precomputed, so the
  # duration and both endpoints can be changed while a sunrise is running and
  # the next step picks them up.
  - id: sunrise_step
    mode: single
    then:
      - lambda: |-
          // Unsigned, so this stays correct across the 49.7-day millis() wrap.
          const uint32_t elapsed = millis() - id(sunrise_t0_ms);
          const float p = id(sunrise_span_ms) == 0
                              ? 1.0f
                              : clamp((float) elapsed / (float) id(sunrise_span_ms), 0.0f, 1.0f);

          auto traits = id(led_light).get_traits();
          const float warmest = traits.get_max_mireds();
          const float target = clamp(1000000.0f / id(sunrise_end_kelvin).state,
                                     traits.get_min_mireds(), warmest);

          // Linear in the light's brightness *state*, and deliberately no
          // curve on top of it. The light's own gamma_correct (2.8, the
          // default) is what bends this into a ramp that looks linear: output
          // goes as p^2.8, close enough to the cube law between luminance and
          // perceived lightness. Squaring it as well would leave the first
          // twenty minutes doing nothing visible.
          id(sunrise_shadow_brightness) =
              ${dim_floor} + p * (id(sunrise_end_brightness).state / 100.0f - ${dim_floor});
          // Warmest to target, so the room reddens before it brightens.
          id(sunrise_shadow_mireds) = warmest + p * (target - warmest);

          // Zero means idle, whether the fade finished or was cancelled, so
          // the sensor answers "is a sunrise running, and how far in" and can
          // be used as a condition. The cost is that it never shows 100 -- the
          // log line below is what says a fade ran to the end.
          id(sunrise_progress).publish_state(p >= 1.0f ? 0.0f : p * 100.0f);

          // Cleared BEFORE the light call below, not after: the on_state hook
          // on the light ignores changes while this is false, and the last
          // step must not be mistaken for somebody reaching for a slider.
          if (p >= 1.0f) {
            id(sunrise_active) = false;
            ESP_LOGI("sunrise", "complete");
          }
      - light.control:
          id: led_light
          state: true
          brightness: !lambda 'return id(sunrise_shadow_brightness);'
          color_temperature: !lambda 'return id(sunrise_shadow_mireds);'
          # Exactly one tick: each step is still transitioning when the next
          # one arrives, so the light interpolates continuously and never
          # actually steps. This is why ${sunrise_tick} can be seconds long.
          transition_length: ${sunrise_tick}

  # Stop the fade and leave the light exactly where it is -- whoever cancelled
  # it has just put it somewhere. `sunrise_handled` is untouched on purpose: it
  # was written when the sunrise armed, so this alarm stays done and the next
  # tick will not start it over.
  - id: sunrise_cancel
    then:
      - lambda: |-
          if (!id(sunrise_active))
            return;
          id(sunrise_active) = false;
          id(sunrise_progress).publish_state(0.0f);
          ESP_LOGI("sunrise", "cancelled");

# The light keys, acted on here since `relay: fan` drops them. `repeats` stays
# on where a hold should ramp, off where it should register once.
binary_sensor:
  # Either brightness button wakes an off light at the bottom of its range:
  # dim_relative reads an off light as zero and the clamp lifts it to the floor.
  - platform: fan_rf
    name: "Remote: brightness up"
    key: bright_up
    on_press:
      - script.execute:
          id: brightness_step
          delta: ${dim_step}

  - platform: fan_rf
    name: "Remote: brightness down"
    key: bright_down
    on_press:
      - script.execute:
          id: brightness_step
          delta: -${dim_step}

  # OBSERVED on hardware: temp+ warms the light, temp- cools it. This was
  # guessed the other way round at first -- the guess was that "+" meant more
  # Kelvin -- and it is the one place in this file where the two conventions
  # for "up" collide. The colour_temp_step script works in mireds, where warmer
  # is a LARGER number and Kelvin runs backwards, so temp+ is a positive delta.
  #
  # If a future remote disagrees, this pair of signs is the only thing to swap.
  - platform: fan_rf
    name: "Remote: colour temperature up"
    key: colour_temp_up
    on_press:
      - script.execute:
          id: colour_temp_step
          delta: ${ct_step}

  - platform: fan_rf
    name: "Remote: colour temperature down"
    key: colour_temp_down
    on_press:
      - script.execute:
          id: colour_temp_step
          delta: -${ct_step}

  - platform: fan_rf
    name: "Remote: light toggle"
    key: light_toggle
    repeats: false
    on_press:
      - light.toggle: led_light

  - platform: fan_rf
    name: "Remote: full brightness"
    key: cycle_full_bright
    repeats: false
    on_press:
      - script.execute: light_full_bright

  - platform: fan_rf
    name: "Remote: night mode"
    key: night_mode
    repeats: false
    on_press:
      - script.execute: light_night_mode

  - platform: fan_rf
    name: "Remote: all off"
    key: all_off
    repeats: false
    on_press:
      - light.turn_off: led_light

# --- claimed keys ----------------------------------------------------------
# DOMAIN_USER: never injected, so their OEM behaviour is gone and they are
# plain buttons now. Deliberately actionless -- add an action here or automate
# the entity from Home Assistant. To hand one back to the fan, move it to
# DOMAIN_FAN in components/fan_rf/fan_rf_protocol.h and drop its block.
  - platform: fan_rf
    name: "Custom: natural wind"
    key: natural_wind
    repeats: false

  - platform: fan_rf
    name: "Custom: 2H"
    key: timer_2h
    repeats: false

  - platform: fan_rf
    name: "Custom: 4H"
    key: timer_4h
    repeats: false

# Commands originated here rather than relayed: one entity per key of the fan
# half, and one per light action the remote has a key for. `key` takes any name
# from PROTOCOL.md section 4, or a raw 0-31 value, and can be templated.
#
# These are the buttons, not the fan: the entity above is the thing to automate
# against, and these are the individual keys under it. Each fan button
# transmits unconditionally and then tells the entity what it sent, which makes
# it the way to resync a fan that has drifted -- the entity sends nothing when
# asked for the state it already claims, and after an ESP32-only restart it
# claims off while the fan runs.
#
# The light buttons run the same local actions the remote's light keys do.
# Nothing of theirs reaches the MCU; `relay: fan` drops the light half.
button:
  - platform: template
    name: "Fan: off"
    on_press:
      # `fan off`, not `all off` -- `all off` would take the light with it.
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_off
      - script.execute:
          id: fan_show_speed
          speed: 0

  - platform: template
    name: "Fan: speed 1"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_1
      - script.execute:
          id: fan_show_speed
          speed: 1

  - platform: template
    name: "Fan: speed 2"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_2
      - script.execute:
          id: fan_show_speed
          speed: 2

  - platform: template
    name: "Fan: speed 3"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_3
      - script.execute:
          id: fan_show_speed
          speed: 3

  - platform: template
    name: "Fan: speed 4"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_4
      - script.execute:
          id: fan_show_speed
          speed: 4

  - platform: template
    name: "Fan: speed 5"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_5
      - script.execute:
          id: fan_show_speed
          speed: 5

  - platform: template
    name: "Fan: speed 6"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_6
      - script.execute:
          id: fan_show_speed
          speed: 6

  - platform: template
    name: "Fan: forward"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_forward
      - script.execute:
          id: fan_show_direction
          reverse: false

  - platform: template
    name: "Fan: reverse"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_reverse
      - script.execute:
          id: fan_show_direction
          reverse: true

  # The one key that crosses the two halves, and the only button here that has
  # to do both jobs itself: the injected frame stops the fan at the MCU, but the
  # light is the ESP32's now and the MCU can no longer switch it off. Same split
  # the remote's own `all off` gets below.
  - platform: template
    name: "All off"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: all_off
      - script.execute:
          id: fan_show_speed
          speed: 0
      - light.turn_off: led_light

  # One tap of a brightness key. A held remote key repeats the step every
  # 41.1 ms; a button is one step, and the light entity's own slider is there
  # for anything that wants to jump straight to a level.
  - platform: template
    name: "Light: brightness up"
    on_press:
      - script.execute:
          id: brightness_step
          delta: ${dim_step}

  - platform: template
    name: "Light: brightness down"
    on_press:
      - script.execute:
          id: brightness_step
          delta: -${dim_step}

  # Named for where the light ends up, not for a sign. "colour temperature up"
  # is the phrase that got the remote keys below backwards: it reads as more
  # Kelvin to one person and a warmer light to the next, and those are opposite
  # directions. Warmer is more mireds, hence the positive delta.
  - platform: template
    name: "Light: warmer"
    on_press:
      - script.execute:
          id: colour_temp_step
          delta: ${ct_step}

  - platform: template
    name: "Light: cooler"
    on_press:
      - script.execute:
          id: colour_temp_step
          delta: -${ct_step}

  - platform: template
    name: "Light: full brightness"
    on_press:
      - script.execute: light_full_bright

  - platform: template
    name: "Light: night mode"
    on_press:
      - script.execute: light_night_mode

  # The whole curve compressed into ${sunrise_test_seconds}, from wherever the
  # light is now and ignoring the alarm entirely. The real thing takes half an
  # hour and happens before dawn, which is not a thing to debug in place.
  #
  # It does not touch `sunrise_handled`, so testing does not consume the
  # morning's alarm.
  - platform: template
    name: "Sunrise: test"
    on_press:
      - lambda: |-
          id(sunrise_span_ms) = ${sunrise_test_seconds} * 1000;
          id(sunrise_t0_ms) = millis();
          id(sunrise_active) = true;
      - script.execute: sunrise_step

  # For stopping one without moving the light. Touching the light does this
  # too, and is what usually will -- see the light's on_state above.
  - platform: template
    name: "Sunrise: cancel"
    on_press:
      - script.execute: sunrise_cancel
