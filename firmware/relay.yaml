# SmarterFan — milestone 2: RF relay + LED dimming
#
# Decodes the remote off the OEM receiver's output pad (GPIO6) and injects
# reconstructed commands into the OEM MCU's RF input (GPIO5), so every fan
# button still works while the ESP32 sits in the middle of the path. The six
# light keys stop here instead: the ESP32 drives the two dimming optocouplers
# itself (GPIO7, GPIO10) and the light is one CWWW entity in Home Assistant.
#
# REQUIRES THE BOARD MODIFIED, both modifications:
#   - the `102` between the RF receiver output and the MCU input removed, and a
#     level shifter on both lines;
#   - `R37` and `R38` removed, and a 620 Ohm from each of GPIO7 and GPIO10 to
#     the opto-side pad each one leaves floating.
# See README.md. firmware/sniffer.yaml is the read-only build and needs
# neither.
#
# Injecting on GPIO5 BEFORE the 102 is removed is not destructive: the ESP32
# and the OEM receiver then both drive the MCU input through a 1 kOhm and the
# two fight through 2 kOhm. It is also not a useful test, because whichever
# source is asserting low wins and the MCU sees a mixture of the two.

# --- bring-up knobs --------------------------------------------------------
# Nothing below has met hardware. The LED bring-up procedure in README.md is
# how each one gets settled.
substitutions:
  # Optocoupler polarity, UNVERIFIED: nobody has established whether more
  # current through the PC817 means brighter or dimmer at the MT9722S dim
  # input. `false` = more duty is brighter. Flip to `true` if the light comes
  # up brightest with the slider at the bottom. Both channels are wired the
  # same way, so both move together.
  led_inverted: "false"

  # The duty a channel sits at when it is on but asked for the least possible.
  # At 1 kHz, 1% is a 10 us pulse and the PC817's practical minimum is roughly
  # 10-20 us, so this is on the bottom edge of what the opto is expected to
  # pass rather than comfortably inside it: a value to measure from, not a
  # validated one. Per channel, because the two optocouplers are separate parts
  # and need not share a floor.
  min_power_r37: "1%"
  min_power_r38: "1%"

  # PWM frequency, both channels, and the knob that decides how dim the light
  # can get. The MT9722S gates its output rather than averaging the dim input,
  # so the lowest usable duty is the driver's minimum pulse width times this
  # frequency: a lower carrier is a dimmer minimum, which is the opposite of
  # the usual instinct. Three things bound it from below -- flicker, visible
  # under ~250 Hz; beating against the 100 Hz mains ripple already on the LED
  # current, so sit between harmonics and not on one; and blade strobing, which
  # is per fan speed and HAS NOT BEEN CHECKED. This sits exactly on the
  # measured flicker floor, with no margin for that last one. The OEM ran
  # 1 kHz, and its dimmest step was 7.4% duty.
  pwm_frequency: "0.25kHz"

  # One step of a brightness button. A held button pulses once per frame,
  # 41.1 ms apart, so 2% sweeps the whole range in 50 steps, ~2.1 s. A tap is
  # one step of the same size -- the remote has no way to say otherwise, and
  # that is how the OEM behaves.
  dim_step: "2%"

  # ...and the floor a hold stops at. light.dim_relative switches the light off
  # when it arrives at zero, so without this, holding `bright -` would end with
  # the light off rather than at its dimmest. `light on/off` and `all off` are
  # the buttons for turning it off.
  dim_floor: "1%"

  # One step of a colour temperature button, as a fraction of the light's
  # mireds range, so the sweep stays ~2 s whatever the Kelvin endpoints below
  # are corrected to.
  ct_step: "0.02"

esphome:
  name: smarterfan-relay
  friendly_name: SmarterFan Relay

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # C3 has native USB-Serial-JTAG; this puts logs on the USB-C port.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 12db
  ap:
    ssid: "SmarterFan Setup"
    password: !secret ap_password

captive_portal:

improv_serial:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# A control page served by the device itself, at http://smarterfan-relay.local/
# -- every entity below with a control for it, no server anywhere. This is the
# whole interface if Home Assistant is never set up; if it is, the two coexist.
#
# Unauthenticated, so anything on the LAN can drive the light. `auth:` with a
# username and password is the knob if that is not wanted.
web_server:
  port: 80

external_components:
  - source:
      type: local
      path: components
    components: [fan_rf]

# --- receive: the OEM receiver's output pad --------------------------------
# Identical to sniffer.yaml. Every value here was settled against real captures
# and the reasoning is written up there; do not diverge without a reason.
remote_receiver:
  pin:
    number: GPIO6
  # Below the 136us shortest real symbol under worst-case AGC skew, and above
  # the idle noise, which is what keeps captures press-correlated.
  filter: 100us
  # Deliberately below the 8.79ms inter-frame gap, so each of a burst's five
  # repeats is its own capture and a held button never fills the buffer.
  idle: 4ms
  receive_symbols: 1024
  buffer_size: 32768
  tolerance: 40%

# --- transmit: into the OEM MCU's RF input ---------------------------------
remote_transmitter:
  id: fan_tx
  pin: GPIO5

  # OOK at baseband. What arrives at the MCU is the demodulated two-level
  # signal the OEM receiver would have produced, not a 433 MHz carrier, so
  # there is nothing to modulate: 100% duty is the carrier switched off.
  # fan_rf also sets carrier_frequency 0 on every call it makes.
  carrier_duty_percent: 100%

  # RMT memory for this channel, in 32-bit symbols. The C3 has 48 words per
  # channel and this is the default; it is written out because the payload
  # size depends on it.
  #
  # Each signed duration fan_rf emits becomes one 16-bit half-symbol, two to a
  # word. The largest payload is the preamble plus one frame: 2 + 66 = 68
  # halves = 34 words. The IDF's first encoding session fills the whole memory
  # block, so at 48 the burst is staged in one pass and the transmission never
  # depends on a refill interrupt landing on time. A bare frame during a hold
  # is 33 words.
  #
  # `tap_frames` above 1 pushes past that — 5 frames is 166 words — and the
  # driver then ping-pongs through half the block at a time. That works, but it
  # puts symbol timing at the mercy of interrupt latency, so raise this to 96
  # if you raise tap_frames, and drop remote_receiver's `rmt_symbols` to 48 to
  # stay inside the C3's 192 words in total.
  rmt_symbols: 48

  # The RMT hands the line back after each frame instead of blocking loop() for
  # the 41.4 ms the frame takes. A hold injects one frame per received repeat,
  # and the next repeat is already being decoded while the current frame goes
  # out — blocking here would stall that.
  non_blocking: true

fan_rf:
  id: fan_remote
  transmitter_id: fan_tx

  press_frames: 5
  run_timeout: 250ms
  dump_frames: false
  # Prints the injected frames as well as the decoded ones, which is the whole
  # diagnostic for the relay until a scope is on the MCU's input pad:
  #
  #   [D][fan_rf]: press  key=18 (fan 2) counter=3  0xA1D8290D
  #   [D][fan_rf]: inject key=18 (fan 2) counter=1  0xA1D82919  1x +preamble
  dump_commands: true

  # The six light keys stop here now that the ESP32 drives the LEDs. Everything
  # else is forwarded, including the five keys whose side of the fan has never
  # been verified.
  #
  # THIS SETTING AND THE R37/R38 REMOVAL ARE ONE CHANGE. Until those resistors
  # are out, the ESP32 is not connected to the optocouplers and `fan` leaves
  # the light with nothing driving it: the MCU stops hearing the light keys and
  # the PWM on GPIO7/GPIO10 goes nowhere. Run `all` until the board is cut.
  relay: fan

  # How long a press waits before it counts as a tap. Pure added latency on
  # every tap, and it cannot go below press_frames x 41.1 ms = 205 ms, which is
  # where the first repeat of a held button lands. See fan_rf/__init__.py.
  relay_decision: 230ms

  # Frames one tap injects. UNVERIFIED whether the MCU accepts a single frame:
  # the remote sends five, but that redundancy is for a noisy RF link and this
  # goes over a wire. Raise it if one turns out not to be enough — and raise
  # remote_transmitter's rmt_symbols with it.
  tap_frames: 1

# Diagnostics. An ESP32 reset takes the GPIOs high-Z, which drops the drive to
# both optocouplers -- indistinguishable from a brief flicker if the reboot is
# quick. Uptime resetting to zero, or a reset_reason other than a clean power-on,
# is what separates that from anything happening in the analogue path. Remove
# once the flicker question is closed.
debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 30s

  # Wi-Fi TX bursts to ~350 mA on the C3, and the drive to both optocouplers
  # comes off the same 3V3 rail. If flickers cluster with radio activity, the
  # bulk capacitance on that rail is the first suspect.
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

# --- LED dimming: the two optocouplers -------------------------------------
# Each GPIO drives a PC817 through 620 Ohm into the pad `R37`/`R38` left
# floating by the modification. Named after the pad rather than the colour,
# because which pad is which colour is not known -- see the light below.
#
# Frequency and min_power are one setting in two halves -- what the opto sees
# is a pulse width, min_power / frequency -- so both live in the substitutions
# above and neither moves alone.
output:
  - platform: ledc
    id: led_r37
    pin: GPIO7
    frequency: ${pwm_frequency}
    min_power: ${min_power_r37}
    # Mandatory next to min_power, not a refinement of it. The mix commands one
    # channel to exactly zero at either end of the colour temperature range,
    # and without this that channel would still emit min_power -- a faint cool
    # glow across a "fully warm" setting that never goes away.
    zero_means_zero: true
    inverted: ${led_inverted}

  - platform: ledc
    id: led_r38
    pin: GPIO10
    frequency: ${pwm_frequency}
    min_power: ${min_power_r38}
    zero_means_zero: true
    inverted: ${led_inverted}

light:
  - platform: cwww
    id: led_light
    name: "Light"

    # WHICH PAD IS THE WARM CHANNEL IS UNVERIFIED. The README pins GPIO7 to
    # R37 and GPIO10 to R38; nothing says which driver is which colour. If the
    # light runs cold where Home Assistant says warm, swap these two ids and
    # change nothing else.
    cold_white: led_r38
    warm_white: led_r37

    # Guesses -- nothing has measured either channel. These set the ends of the
    # Home Assistant slider and the Kelvin it is labelled with; the mix
    # normalises whatever range they describe, so the hardware does exactly the
    # same thing whatever numbers go here.
    cold_white_color_temperature: 6500K
    warm_white_color_temperature: 2700K

    # The default, stated because it is load-bearing. Each channel's duty is
    # brightness x its fraction, and the two fractions are normalised by the
    # larger of them: in the middle of the range both come out at 1.0, so at
    # 100% brightness both LEDs are at full. The price is that total output is
    # not constant as the slider sweeps -- it roughly doubles toward the middle
    # -- which is visible, and is what being able to reach full output costs.
    constant_brightness: false

    # A held button delivers 24 steps a second and the default is 1s, so this
    # would otherwise be 24 overlapping one-second fades. Automations that want
    # a fade -- the sunrise alarm -- pass their own transition_length.
    default_transition_length: 0s

    # Brightness, mix and on/off all come back after a restart. This does mean
    # the light turns itself on when a blackout ends.
    restore_mode: RESTORE_DEFAULT_OFF

# ESPHome has light.dim_relative but no colour temperature equivalent, and this
# script is the whole of that gap.
script:
  - id: colour_temp_step
    parameters:
      # Signed fraction of the light's mireds range; positive is warmer.
      delta: float
    then:
      # control, not turn_on: pressing temp+ on a light that is off adjusts the
      # mix it will come back at instead of switching it on.
      - light.control:
          id: led_light
          color_temperature: !lambda |-
            auto traits = id(led_light).get_traits();
            const float lo = traits.get_min_mireds();
            const float hi = traits.get_max_mireds();
            float cur = id(led_light).remote_values.get_color_temperature();
            // Zero until something sets a colour temperature -- a first boot
            // with nothing restored. Start such a press from the middle.
            if (cur < lo || cur > hi)
              cur = (lo + hi) / 2.0f;
            return clamp(cur + delta * (hi - lo), lo, hi);

# The remote's light keys, acted on here rather than passed to the MCU, since
# `relay: fan` above drops all six. `repeats` is left on where holding should
# ramp and turned off where a hold should register once.
binary_sensor:
  - platform: fan_rf
    name: "Remote: brightness up"
    key: bright_up
    on_press:
      - light.dim_relative:
          id: led_light
          relative_brightness: ${dim_step}
          brightness_limits:
            min_brightness: ${dim_floor}
            max_brightness: 100%

  # Either brightness button wakes a light that is off, at the bottom of its
  # range -- dim_relative works off state x brightness, so an off light reads
  # as zero and the clamp brings it back up to the floor.
  - platform: fan_rf
    name: "Remote: brightness down"
    key: bright_down
    on_press:
      - light.dim_relative:
          id: led_light
          relative_brightness: -${dim_step}
          brightness_limits:
            min_brightness: ${dim_floor}
            max_brightness: 100%

  # temp+ raises the colour temperature in Kelvin, i.e. towards cooler, which
  # is a fall in mireds -- hence the negative delta. Which way the OEM's two
  # buttons actually go has never been observed; swapping these two signs is
  # the whole change if this is backwards.
  - platform: fan_rf
    name: "Remote: colour temperature up"
    key: colour_temp_up
    on_press:
      - script.execute:
          id: colour_temp_step
          delta: -${ct_step}

  - platform: fan_rf
    name: "Remote: colour temperature down"
    key: colour_temp_down
    on_press:
      - script.execute:
          id: colour_temp_step
          delta: ${ct_step}

  - platform: fan_rf
    name: "Remote: light toggle"
    key: light_toggle
    repeats: false
    on_press:
      - light.toggle: led_light

  - platform: fan_rf
    name: "Remote: full brightness"
    key: cycle_full_bright
    repeats: false
    on_press:
      - light.turn_on:
          id: led_light
          brightness: 100%
          # The middle of the range: both fractions are 0.5, both normalise to
          # 1.0, both LEDs end up at full.
          color_temperature: !lambda |-
            auto traits = id(led_light).get_traits();
            return (traits.get_min_mireds() + traits.get_max_mireds()) / 2.0f;

  # Reaches the MCU as well: `night mode` is one of the five UNVERIFIED keys,
  # so `relay: fan` forwards it and nobody knows what the MCU does with it. If
  # it turns out to touch only the light, it belongs in key_domain()'s light
  # group and this relay will stop.
  - platform: fan_rf
    name: "Remote: night mode"
    key: night_mode
    repeats: false
    on_press:
      - light.turn_on:
          id: led_light
          brightness: ${dim_floor}
          color_temperature: !lambda |-
            return id(led_light).get_traits().get_max_mireds();

  # Also still relayed, and here that is the intent -- it stops the fan too.
  - platform: fan_rf
    name: "Remote: all off"
    key: all_off
    repeats: false
    on_press:
      - light.turn_off: led_light

# Commands originated here rather than relayed. `key` takes any name from the
# table in PROTOCOL.md section 4, or a raw 0-31 value, and can be templated.
button:
  # Diagnostic for the occasional flicker. The radio is the largest current
  # step on the 3V3 rail the optocoupler drive shares, so taking it away for a
  # while is the cleanest way to ask whether it is the aggressor. The remote
  # keeps working throughout -- the decode path is RMT and never touches the
  # network stack -- so the light stays usable with nothing on the air.
  #
  # It re-enables itself, and a crash reboots with the radio on, so there is no
  # way for this to strand the board.
  - platform: template
    name: "Diagnostic: radio off 30 min"
    on_press:
      - wifi.disable:
      - delay: 30min
      - wifi.enable:

  - platform: template
    name: "Fan: off"
    on_press:
      - fan_rf.send_key:
          fan_rf_id: fan_remote
          key: fan_off

  - platform: template
    name: "Fan: speed 1"
    on_press:
      - fan_rf.send_key: fan_1
